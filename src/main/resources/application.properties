spring.application.name=libraff-book-store

server.port=8080

spring.datasource.url=jdbc:h2:mem:db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace


spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.root=WARN
spring.output.ansi.enabled=ALWAYS

resilience4j.ratelimiter.instances.restockBook.limitForPeriod=10
resilience4j.ratelimiter.instances.restockBook.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.restockBook.timeoutDuration=0

resilience4j.ratelimiter.instances.employeeController.limitForPeriod=50
resilience4j.ratelimiter.instances.employeeController.limitRefreshPeriod=1m
resilience4j.ratelimiter.instances.employeeController.timeoutDuration=0

app.rateLimitPerMinute=25

jwt.secret=${JWT_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


data.redis.host=localhost
data.redis.port=6379

# ===== Spring AI =====
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

# Embedding model (runs locally, multilingual — Azerbaijani language support)
spring.ai.embedding.transformer.onnx.model-uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json

logging.level.org.springframework.ai=DEBUG